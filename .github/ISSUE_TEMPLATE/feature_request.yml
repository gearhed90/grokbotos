name: 기능 제안 / Feature request
description: 새 기능이나 개선을 제안할 때 / Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 / Problem
      description: 어떤 상황에서 무엇이 불편한가요 / What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 / Proposal
      description: 원하는 동작. 화면, 명령, API 예시가 있으면 좋습니다 / Desired behaviour, ideally with screens, commands or API examples
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역 / Area
      options:
        - OS API (grokbotd, MCP)
        - 웹앱 런타임과 설치 / Web-app runtime & install
        - 바탕화면, 독, 위젯 / Desktop, docks, widgets
        - 하드웨어, 드라이버 / Hardware & drivers
        - 이미지, 업데이트 / Image & updates (bootc)
        - 문서 / Docs
        - 기타 / Other
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 / Alternatives considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: 확인 / Checks
      options:
        - label: README 로드맵과 docs/ROADMAP.md를 확인했습니다 / I checked the roadmap
