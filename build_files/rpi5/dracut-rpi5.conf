# ostree-prepare-root mounts a composefs/erofs image. kernel-rpi5 ships
# EROFS as a module (CONFIG_EROFS_FS=m). If dracut leaves erofs.ko out,
# ostree-prepare-root.service fails before userspace starts.
hostonly="no"
add_dracutmodules+=" ostree "
add_drivers+=" erofs overlay nvme sdhci sdhci-pltfm xhci-hcd xhci-pci usbhid usb-storage uas "
