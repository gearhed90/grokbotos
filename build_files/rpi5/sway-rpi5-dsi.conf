# Raspberry Pi 5 only (installed by rpi5-prepare.sh). The Touch Display 2
# panel is portrait; sway names it DSI-2 (card0-DSI-2) on this kernel.
# Rotate it to landscape and keep the Goodix touchscreen on that output.
# Mapping touch to DSI-1 kills touch. No effect without a DSI panel.
output DSI-1 transform 90
output DSI-2 transform 90
input type:touch map_to_output DSI-2
