<button id="mute" hidden title="Spoken replies"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg></button>
<button id="mic" hidden title="Hold to talk (or hold Space)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div></div></div><div id="vnote"></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search);
let W,H,dpr;function rs(){dpr=Q.has('dpr')?+Q.get('dpr'):.5;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',rs);rs();
const P=[];for(let i=0;i<512;i++)P.push(Math.random());
function n1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return P[i&511]*(1-u)+P[(i+1)&511]*u-.5;}
const ALIAS={speaking:'working',describing:'working',handling:'thinking'};
const STATES=['idle','thinking','looking','working','typing','sleeping','listening'];
const LAY=Object.assign({cx:.5,cy:.43,h:.55},window.AVATAR_LAYOUT||{});
let state='idle',sT=0;
window.setAvatarState=s=>{s=ALIAS[s]||s;if(!STATES.includes(s))s='idle';if(s!==state){state=s;sT=0;nextMove=0;}};
// springs: slightly underdamped (footage shows quick ~0.15-0.2s moves with a little settle)
const sp={};function S(n,v){sp[n]={x:v,v:0,t:v};}function T(n,v){sp[n].t=v;}function G(n){return sp[n].x;}
[['scl',1],['rot',0],['lx',0],['ly',0],['lean',0],['round',0],['type',0],['sy',1],['glow',0],['sleep',0]].forEach(p=>S(...p));
function stepSprings(DT){const n=Math.ceil(DT/.008),dt=DT/n;for(let i=0;i<n;i++)for(const k in sp){const p=sp[k],K=k==='sleep'?45:k==='type'?170:260,C=k==='sleep'?11:k==='type'?24:22;
 p.v+=((p.t-p.x)*K-p.v*C)*dt;p.x+=p.v*dt;}}
let nextBlink=1.5+Math.random()*3,blinkT=-1,nextMove=0;
const forceBlink=Q.has('blink')?+Q.get('blink'):null;
function stadium(t,w,h){const r=w/2,L=h-w,per=2*L+2*Math.PI*r;let s=t*per;
 if(s<L)return[r,-L/2+s,1,0];s-=L;
 if(s<Math.PI*r){const a=s/r;return[r*Math.cos(a),L/2+r*Math.sin(a),Math.cos(a),Math.sin(a)];}s-=Math.PI*r;
 if(s<L)return[-r,L/2-s,-1,0];s-=L;const a=Math.PI+s/r;return[r*Math.cos(a),-L/2+r*Math.sin(a),Math.cos(a),Math.sin(a)];}
const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],D=Math.PI/180;
function choreo(t){
 // targets per state; values in body-local units (lx,ly: -1..1 of eye travel)
 if(state!=='typing')T('type',0);T('sleep',state==='sleeping'?1:0);T('scl',state==='looking'?.78:1);
 if(state==='idle'){T('round',0);T('rot',0);T('lean',0);T('sy',1);T('glow',0);
  if(t>nextMove){nextMove=t+1.5+R()*4;if(R()<.45){T('lx',0);T('ly',0)}else{T('lx',(R()*2-1)*.5);T('ly',(R()*2-1)*.3)}}}
 else if(state==='thinking'){T('round',1);T('rot',0);T('lean',0);T('sy',1);T('glow',1);
  if(t>nextMove){nextMove=t+.8+R()*1.5;T('lx',(R()*2-1)*.25);T('ly',-.1+(R()*2-1)*.15)}}
 else if(state==='looking'){T('glow',.3);T('sy',1);
  // verified sequence: tilt ~35deg clockwise (left end up) with dot eyes up-left, hold,
  // then counter-tilt ~-12deg eyes right, then ~-20deg with leaning oval eyes
  const c=sT%2.8;
  if(c<1.2){T('rot',35*D);T('lx',-.75);T('ly',-.35);T('round',1);T('lean',0)}
  else if(c<2.0){T('rot',-12*D);T('lx',.6);T('ly',-.15);T('round',1);T('lean',0)}
  else{T('rot',-20*D);T('lx',.4);T('ly',-.1);T('round',0);T('lean',18*D)}}
 else if(state==='working'){T('round',0);T('glow',.2);
  if(t>nextMove){nextMove=t+.5+R()*.8;const m=pick(['center','center','lean','lean','up','down','tiltL','tiltR']);
   T('rot',0);T('lean',0);T('sy',1);T('lx',0);T('ly',0);
   if(m==='lean'){const d=R()<.5?-1:1;T('lean',d*15*D);T('rot',-d*6*D);T('lx',d*.25)}
   if(m==='up'){T('ly',-1.15);T('sy',1.06)}   // eyes ride up and get clipped by the top edge
   if(m==='down'){T('ly',.9);T('sy',.96)}
   if(m==='tiltL'||m==='tiltR'){const d=m==='tiltL'?-1:1;T('rot',d*8*D);T('lx',d*.4)}}}
 else if(state==='sleeping'){T('round',0);T('rot',0);T('lean',0);T('sy',1);T('glow',0);T('lx',0);T('ly',.15)}
 else if(state==='listening'){T('round',0);T('rot',0);T('lean',0);T('sy',1.02);T('glow',.55+.25*Math.sin(t*5));T('lx',0);T('ly',-.18)}  // attentive: eyes lift, soft glow pulse
 else if(state==='typing'){T('type',1);T('glow',.2);T('rot',0);T('lean',0);T('lx',0);T('ly',0);T('sy',1)}
}
let last=0,t0=performance.now();
function frame(now){requestAnimationFrame(frame);const fi=state==='sleeping'?50:(state==='idle'?33:24);if(document.hidden||now-last<fi-2)return;
 const dt=Math.min(.05,(now-(last||now))/1000);last=now;const t=(now-t0)/1000;sT+=dt;
 choreo(t);stepSprings(dt);
 const sl=Math.max(0,Math.min(1,G('sleep')));
 if(sl>.35)wasAsleep=true;
 if(wasAsleep&&sl<.25&&state!=='sleeping'){wasAsleep=false;blinkT=0;}  // waking: eyes open with a blink
 if(blinkT<0&&t>nextBlink&&state!=='typing'&&sl<.05){blinkT=0;nextBlink=t+2+R()*4+(R()<.2?-1.7:0);}
 let lid=1;if(blinkT>=0){blinkT+=dt;const p=blinkT/.16;lid=p<1?1-Math.sin(p*Math.PI)*.88:1;if(p>=1)blinkT=-1;}
 if(forceBlink!==null)lid=forceBlink;
 const Sc=H/720,ty=Math.max(0,Math.min(1,G('type')));
 const sb=Math.sin(t*6.283/4.6);  // slow sleep breath, ~4.6 s cycle
 const breath=1+.012*Math.sin(t*1.3)*(1-sl)+.025*sb*sl;
 const exhale=Math.max(0,-sb)*sl;
 const h0=H*LAY.h*breath,w0=h0*1.9,cx=W*LAY.cx,cy=H*LAY.cy+sl*H*LAY.h*.05;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const gl=G('glow'),gp=(.5+.12*Math.sin(t*1.2)+gl*(.35+.25*Math.sin(t*4)))*(1-.6*sl)*(1+.25*sb*sl);
 const gg=ctx.createRadialGradient(cx,cy,h0*.45,cx,cy,w0*.75);
 gg.addColorStop(0,`rgba(20,195,112,${.16*gp})`);gg.addColorStop(.5,`rgba(20,195,112,${.05*gp})`);gg.addColorStop(1,'rgba(20,195,112,0)');
 ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
 // typing morph: pill squashes to a circle, which then shrinks to the size of two side dots
 const tSince=state==='typing'?sT:0;
 const shrink=state==='typing'?Math.min(1,Math.max(0,(tSince-.15)/.45)):0,se=shrink*shrink*(3-2*shrink);
 const circR=h0/2*(1-.06*ty)*(1-se*.62);
 const w=(w0+(circR*2-w0)*ty)*(1+.015*exhale),h=(h0+(circR*2-h0)*ty)*G('sy')*(1-.03*exhale);  // gentle squash on exhale
 ctx.save();ctx.translate(cx,cy+(1-G('sy'))*h0*.5);ctx.rotate(G('rot'));ctx.scale(G('scl'),G('scl'));
 ctx.beginPath();const N=140,amp=h0*.008*(1-ty);
 for(let i=0;i<=N;i++){const[x,y,nx,ny]=stadium(i/N,h,w);const a=i/N*6.283;
  const d=amp*(n1(Math.cos(a)*1.5+t*.6+10)+n1(Math.sin(a)*1.5+t*.5+40)+.6*n1(Math.cos(a*3)*2+Math.sin(a*2)+t*.9+70));
  const px=y+ny*d,py=x+nx*d;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
 ctx.closePath();{const bg=ctx.createLinearGradient(0,-h/2,0,h/2);bg.addColorStop(0,'#14C370');bg.addColorStop(.55,'#14C370');bg.addColorStop(.7,'rgb(19,188,108)');bg.addColorStop(.85,'rgb(18,178,102)');bg.addColorStop(1,'rgb(17,170,97)');ctx.fillStyle=bg;}ctx.fill();
 // eyes, clipped to the body (footage shows them sliding under the top edge)
 const eA=Math.max(0,1-ty*2.2);
 if(eA>0){ctx.save();ctx.clip();ctx.globalAlpha=eA;ctx.fillStyle='#000';const lidS=lid*(1-sl);
  const rd=Math.max(0,Math.min(1,G('round'))),eS=1/Math.max(.6,G('scl'))*(state==='looking'?.75:1);
  const ew=h0*(.25+(.26-.25)*rd)*eS,eh=h0*(.46+(.26-.46)*rd)*eS*Math.max(lidS,.1),ehh=Math.max(eh,2*Sc);
  const ex=h0*(.25+.02*rd)*eS,ey=-h0*.02;
  for(const s of[-1,1]){const x=s*ex+G('lx')*h0*.272,y=ey+G('ly')*h0*.3;
   ctx.save();ctx.translate(x,y);ctx.rotate(G('lean'));
   if(sl<.55){ctx.globalAlpha=eA*(1-Math.max(0,sl-.35)/.2);ctx.beginPath();ctx.roundRect(-ew/2,-ehh/2,ew,ehh,Math.min(ew/2,ehh/2));ctx.fill();}
   if(sl>.35){// closed sleeping eye: short downward-curved arc
    ctx.globalAlpha=eA*Math.min(1,(sl-.35)/.2);ctx.beginPath();ctx.moveTo(-ew*.5,0);ctx.quadraticCurveTo(0,ew*.38,ew*.5,0);
    ctx.lineWidth=h0*.05;ctx.lineCap='round';ctx.strokeStyle='#000';ctx.stroke();}
   ctx.restore();}
  ctx.restore();}
 // side dots
 if(ty>.02){const rs=h0*.1*Math.min(1,ty*1.3),gap=Math.max(circR+rs+h0*.08,h0*.42)*Math.min(1,ty);
  const wave=state==='typing'?Math.max(0,tSince-.6):0;
  const dots=[[-gap,rs,0],[gap,rs,2]];
  for(const[x,r,ph]of dots){const pu=wave>0?.5+.5*Math.sin(wave*7-ph):0;
   ctx.beginPath();ctx.arc(x,0,r*(1+.12*pu),0,6.283);
   ctx.fillStyle=`rgba(20,195,112,${(.42+.4*pu)*ty})`;ctx.fill();}
  if(wave>0){/* middle dot also joins the wave */}}
 ctx.restore();
 // drifting z's from the upper right of the body, one per breath
 if(sl>.6&&state==='sleeping'){const ph=Math.floor(t/1.55);if(lastZ<0){zs.push({b:t-1.4},{b:t-2.9});}if(ph!==lastZ){lastZ=ph;zs.push({b:t});}}
 zs=zs.filter(z=>t-z.b<4.2);if(state!=='sleeping')lastZ=-1;
 for(const z of zs){const a=(t-z.b)/4.2,fs=h0*(.11+.1*a);
  ctx.save();ctx.globalAlpha=Math.sin(Math.PI*Math.min(1,a*1.15))*.85*Math.max(sl,.0);
  ctx.fillStyle='#6EE7B7';ctx.font=`700 ${fs}px "Nunito","Varela Round",system-ui,sans-serif`;
  ctx.translate(cx+w0*.38+a*h0*.35+Math.sin(a*6)*h0*.04,cy-h0*.4-a*h0*.6);ctx.rotate(-.15);ctx.fillText('z',0,0);ctx.restore();}
}
let zs=[],lastZ=-1,wasAsleep=false;
requestAnimationFrame(frame);
if(Q.get('state'))setAvatarState(Q.get('state'));
if(Q.has('sim')){const sec=+Q.get('sim');for(let i=0;i<sec*120;i++){sT+=1/120;choreo(i/120);stepSprings(1/120);}t0-=sec*1000;nextBlink+=sec;}
const inp=document.getElementById('in'),echo=document.getElementById('echo'),rep=document.getElementById('reply');let tms=[],busy=false;
const live=location.protocol.startsWith('http');
function say(t,err){if(!err&&window.novaVoice)novaVoice.speak(t);rep.textContent=t;rep.classList.toggle('err',!!err);rep.style.opacity=1;tms.forEach(clearTimeout);
 setAvatarState(err?'idle':'typing');const hold=Math.min(14000,3500+t.length*60);
 tms=[setTimeout(()=>setAvatarState('idle'),Math.min(2500,600+t.length*25)),setTimeout(()=>{rep.style.opacity=0;echo.style.opacity=0},hold)];}
async function ask(q,via){busy=true;setAvatarState('thinking');rep.style.opacity=0;let done=false;
 try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q,via:via||'typed'})});
  if(!r.ok)throw new Error('http '+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {value,done:d}=await rd.read();if(d)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line.trim())continue;const ev=JSON.parse(line);
    if(ev.state)setAvatarState(ev.state==='working'?'working':'thinking');
    if(ev.confirm){askConfirm(ev.confirm);done=true}if(ev.reply){say(ev.reply);done=true}if(ev.error){say(ev.text||'Something went wrong.',true);done=true}}}
  if(!done)say('Hmm, I lost my train of thought. Try again?',true);
 }catch(e){say("I can't reach my helper service right now (novad).",true)}busy=false;}
const cf=document.getElementById('cf');let pend=null,pendT=0;
function askConfirm(c){pend=c.id;rep.textContent=c.text;rep.classList.remove('err');rep.style.opacity=1;tms.forEach(clearTimeout);
 setAvatarState('idle');rep.classList.add('q');cf.classList.add('on');clearTimeout(pendT);pendT=setTimeout(()=>{if(pend){endConfirm();say('No answer, so I left it.',true)}},(c.ttl||60)*1000);}
function endConfirm(){pend=null;rep.classList.remove('q');cf.classList.remove('on');clearTimeout(pendT);}
async function answer(yes){if(!pend)return;const id=pend;endConfirm();setAvatarState(yes?'working':'idle');
 try{const r=await fetch('/api/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,yes})});
  const j=await r.json();if(j.reply)say(j.reply);else say(j.text||'Something went wrong.',true);}catch(e){say("I can't reach my helper service right now (novad).",true)}
 echo.style.opacity=0;}
document.getElementById('yes').onclick=()=>answer(true);document.getElementById('no').onclick=()=>answer(false);
addEventListener('keydown',e=>{if(!pend)return;if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();answer(true)}else if(e.key==='Escape'){e.preventDefault();answer(false)}},true);
if(Q.get('confirm')){askConfirm({id:'demo',text:Q.get('confirm'),ttl:3600});echo.textContent=Q.get('q')||'';echo.style.opacity=.45;}
if(inp)inp.addEventListener('keydown',e=>{if(e.key!=='Enter'||!inp.value.trim()||busy)return;
 const q=inp.value.trim();echo.textContent=q;echo.style.opacity=.45;inp.value='';tms.forEach(clearTimeout);
 if(live){ask(q);return}
 const seq=[['thinking',0],['looking',1500],['working',4300],['typing',7300],['idle',9300]];
 tms=seq.map(([s,d])=>setTimeout(()=>{setAvatarState(s);if(s==='idle')echo.style.opacity=0},d));});
// ---------- voice (step 6): push-to-talk, recorded by novad with pw-record ----------
const mic=document.getElementById('mic'),mute=document.getElementById('mute'),vnote=document.getElementById('vnote');
const V={mic:false,speaker:false,muted:false,cap:30,rec:false,speaking:false,downAt:0,tap:false,capT:0,noteT:0};
function note(t,ms){vnote.textContent=t;vnote.style.opacity=1;clearTimeout(V.noteT);V.noteT=setTimeout(()=>vnote.style.opacity=0,ms||3500);}
function paintMute(){mute.querySelector('.w').style.display=V.muted?'none':'';mute.querySelector('.x').style.display=V.muted?'':'none';mute.title=V.muted?'Spoken replies off':'Spoken replies on';}
function vpost(p,b){return fetch('/api/voice/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());}
let firstStatus=true;
async function vstatus(){try{const s=await (await fetch('/api/voice/status')).json();
  const had=V.mic;V.mic=s.mic;V.speaker=s.speaker;V.muted=s.muted;V.cap=s.cap_s||30;
  mic.hidden=false;mic.classList.toggle('off',!V.mic);mic.title=V.mic?'Hold to talk (or hold Space)':'No microphone found';
  mute.hidden=!V.speaker;paintMute();
  if(!V.mic&&(firstStatus||had))note('No microphone found',4000);else if(V.mic&&!had&&!firstStatus)note('Microphone connected',2500);
  firstStatus=false;}catch(e){}}
async function startListen(){if(V.rec||busy)return;if(!V.mic){note('No microphone found');return;}
 V.rec=true;mic.classList.add('on');tms.forEach(clearTimeout);rep.style.opacity=0;setAvatarState('listening');
 const r=await vpost('start').catch(()=>({error:'net'}));
 if(r.error){V.rec=false;mic.classList.remove('on');setAvatarState('idle');if(r.error==='nomic'){V.mic=false;mic.classList.add('off')}note(r.text||'Voice is unavailable.');return;}
 clearTimeout(V.capT);V.capT=setTimeout(()=>stopListen(false,true),(r.cap_s||V.cap)*1000);}
async function stopListen(cancel,capped){if(!V.rec)return;V.rec=false;clearTimeout(V.capT);mic.classList.remove('on');
 setAvatarState(cancel?'idle':'thinking');const r=await vpost('stop',{cancel:!!cancel}).catch(()=>({error:'net',text:"I can't reach my helper service right now (novad)."}));
 if(cancel)return;if(r.error){setAvatarState('idle');note(r.text||"I didn't catch that.");return;}
 if(capped||r.capped)note('Stopped at '+Math.round(V.cap)+' seconds',2500);
 if(pend&&r.intent){echo.textContent=r.transcript;echo.style.opacity=.45;answer(r.intent==='yes');return;}
 if(pend){setAvatarState('idle');note('Say yes or no, or tap a button.');return;}
 inp.value=r.transcript;echo.textContent=r.transcript;echo.style.opacity=.45;   // shown in the bar, then sent as normal
 setTimeout(()=>{inp.value='';ask(r.transcript,'voice')},450);}
// mic button: hold to talk, or tap once to start and tap again to stop
mic.addEventListener('pointerdown',e=>{e.preventDefault();if(V.rec&&V.tap){V.tap=false;stopListen();return;}V.downAt=performance.now();startListen();});
mic.addEventListener('pointerup',()=>{if(!V.rec)return;if(performance.now()-V.downAt<350)V.tap=true;else stopListen();});
mic.addEventListener('pointercancel',()=>{if(V.rec&&!V.tap)stopListen()});
// Space: hold while the bar is empty
addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat&&V.rec)return;if(inp.value.length||e.target!==inp&&e.target!==document.body)return;
 e.preventDefault();if(!e.repeat)startListen();},true);
addEventListener('keyup',e=>{if(e.code==='Space'&&V.rec&&!V.tap){e.preventDefault();stopListen();}},true);
addEventListener('keydown',e=>{if(e.key==='Escape'&&V.rec){V.tap=false;stopListen(true)}});
mute.onclick=async()=>{const r=await vpost('mute',{muted:!V.muted}).catch(()=>null);if(r){V.muted=r.muted;paintMute();note(V.muted?'Spoken replies off':'Spoken replies on',2000);}};
window.novaVoice={
 speak:async t=>{if(!live||!V.speaker||V.muted)return;V.speaking=true;setTimeout(()=>{if(V.speaking)setAvatarState('speaking')},Math.min(2500,600+t.length*25)+50);
  try{await vpost('speak',{text:t})}catch(e){}V.speaking=false;if(!V.rec&&!busy&&!pend)setAvatarState('idle');},
 // Wake-word hook (not implemented): a future detector in novad will push an event
 // and the page calls novaVoice.startListening(); stopping would come from end-of-speech.
 startListening:startListen,stopListening:()=>stopListen(),status:()=>({...V})};
if(live){vstatus();setInterval(vstatus,10000);}
else if(Q.get('mic')){mic.hidden=false;mute.hidden=false;paintMute();if(Q.get('mic')==='on')mic.classList.add('on');if(Q.get('mic')==='none'){mic.classList.add('off');note('No microphone found',1e9)}}
if(Q.get('reply')){rep.style.transition=echo.style.transition='none';echo.textContent=Q.get('q')||'';echo.style.opacity=.45;say(Q.get('reply'))}
})();
</script></body></html>
