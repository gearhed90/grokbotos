# Raspberry Pi 5 only (installed by rpi5-nova.sh). Nova is the main screen.
# The global rule "for_window [app_id=".*"] inhibit_idle fullscreen" would keep the
# screen on forever behind a fullscreen Nova; Nova must let the screen sleep.
for_window [app_id="nova-shell"] inhibit_idle none, fullscreen enable
# Web pages Nova opens (novad open_url) keep the fullscreen idle rule, so video stays on.
for_window [app_id="nova-web"] fullscreen enable
