<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova lock (mockup)</title><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#clock{position:fixed;top:22px;left:0;right:0;text-align:center;pointer-events:none}
#time{font-size:44px;font-weight:300;letter-spacing:1px}#date{font-size:16px;opacity:.6;margin-top:2px}
#pad{position:fixed;left:50%;width:50%;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:60px;box-sizing:border-box}
#dots{display:flex;gap:16px;height:22px;margin-bottom:26px}
#dots span{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-sizing:border-box;transition:background .12s}
#dots span.on{background:#fff;border-color:#fff}
#dots.shake{animation:sh .42s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
#hint{font-size:14px;opacity:.5;height:18px;margin-bottom:10px}
#keys{display:grid;grid-template-columns:repeat(3,84px);gap:14px 30px}
#keys button{width:84px;height:84px;border-radius:50%;border:none;background:#1c1f1e;color:#fff;font-size:32px;font-weight:300;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s}
#keys button:active,#keys button.p{background:#3a3f3d}
#keys .act{background:transparent;font-size:17px}
#keys .ok{background:#14C370;color:#04170d;font-size:17px;font-weight:600}
</style></head><body><canvas id="c"></canvas>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="pad"><div id="hint">Enter PIN</div><div id="dots"></div><div id="keys"></div></div>
<script>
/* MOCKUP ONLY. This page does NOT authenticate anything.
   Real PIN checking will go through the system's existing PIN/PAM path
   (the session/greeter), never in this page. The '1234' check below is demo-only. */
window.AVATAR_LAYOUT={cx:.25,cy:.52,h:.36};
</script>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const Q=new URLSearchParams(location.search);
let W,H,dpr;function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',rs);rs();
const P=[];for(let i=0;i<512;i++)P.push(Math.random());
function n1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return P[i&511]*(1-u)+P[(i+1)&511]*u-.5;}
const ALIAS={speaking:'working',describing:'working',handling:'thinking'};
const STATES=['idle','thinking','looking','working','typing','sleeping'];
const LAY=Object.assign({cx:.5,cy:.43,h:.55},window.AVATAR_LAYOUT||{});
let state='idle',sT=0;
window.setAvatarState=s=>{s=ALIAS[s]||s;if(!STATES.includes(s))s='idle';if(s!==state){state=s;sT=0;nextMove=0;}};
// springs: slightly underdamped (footage shows quick ~0.15-0.2s moves with a little settle)
const sp={};function S(n,v){sp[n]={x:v,v:0,t:v};}function T(n,v){sp[n].t=v;}function G(n){return sp[n].x;}
[['scl',1],['rot',0],['lx',0],['ly',0],['lean',0],['round',0],['type',0],['sy',1],['glow',0],['sleep',0]].forEach(p=>S(...p));
function stepSprings(DT){const n=Math.ceil(DT/.008),dt=DT/n;for(let i=0;i<n;i++)for(const k in sp){const p=sp[k],K=k==='sleep'?45:k==='type'?170:260,C=k==='sleep'?11:k==='type'?24:22;
 p.v+=((p.t-p.x)*K-p.v*C)*dt;p.x+=p.v*dt;}}
let nextBlink=1.5+Math.random()*3,blinkT=-1,nextMove=0;
const forceBlink=Q.has('blink')?+Q.get('blink'):null;
function stadium(t,w,h){const r=w/2,L=h-w,per=2*L+2*Math.PI*r;let s=t*per;
 if(s<L)return[r,-L/2+s,1,0];s-=L;
 if(s<Math.PI*r){const a=s/r;return[r*Math.cos(a),L/2+r*Math.sin(a),Math.cos(a),Math.sin(a)];}s-=Math.PI*r;
 if(s<L)return[-r,L/2-s,-1,0];s-=L;const a=Math.PI+s/r;return[r*Math.cos(a),-L/2+r*Math.sin(a),Math.cos(a),Math.sin(a)];}
const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],D=Math.PI/180;
function choreo(t){
 // targets per state; values in body-local units (lx,ly: -1..1 of eye travel)
 if(state!=='typing')T('type',0);T('sleep',state==='sleeping'?1:0);T('scl',state==='looking'?.78:1);
 if(state==='idle'){T('round',0);T('rot',0);T('lean',0);T('sy',1);T('glow',0);
  if(t>nextMove){nextMove=t+1.5+R()*4;if(R()<.45){T('lx',0);T('ly',0)}else{T('lx',(R()*2-1)*.5);T('ly',(R()*2-1)*.3)}}}
 else if(state==='thinking'){T('round',1);T('rot',0);T('lean',0);T('sy',1);T('glow',1);
  if(t>nextMove){nextMove=t+.8+R()*1.5;T('lx',(R()*2-1)*.25);T('ly',-.1+(R()*2-1)*.15)}}
 else if(state==='looking'){T('glow',.3);T('sy',1);
  // verified sequence: tilt ~35deg clockwise (left end up) with dot eyes up-left, hold,
  // then counter-tilt ~-12deg eyes right, then ~-20deg with leaning oval eyes
  const c=sT%2.8;
  if(c<1.2){T('rot',35*D);T('lx',-.75);T('ly',-.35);T('round',1);T('lean',0)}
  else if(c<2.0){T('rot',-12*D);T('lx',.6);T('ly',-.15);T('round',1);T('lean',0)}
  else{T('rot',-20*D);T('lx',.4);T('ly',-.1);T('round',0);T('lean',18*D)}}
 else if(state==='working'){T('round',0);T('glow',.2);
  if(t>nextMove){nextMove=t+.5+R()*.8;const m=pick(['center','center','lean','lean','up','down','tiltL','tiltR']);
   T('rot',0);T('lean',0);T('sy',1);T('lx',0);T('ly',0);
   if(m==='lean'){const d=R()<.5?-1:1;T('lean',d*15*D);T('rot',-d*6*D);T('lx',d*.25)}
   if(m==='up'){T('ly',-1.15);T('sy',1.06)}   // eyes ride up and get clipped by the top edge
   if(m==='down'){T('ly',.9);T('sy',.96)}
   if(m==='tiltL'||m==='tiltR'){const d=m==='tiltL'?-1:1;T('rot',d*8*D);T('lx',d*.4)}}}
 else if(state==='sleeping'){T('round',0);T('rot',0);T('lean',0);T('sy',1);T('glow',0);T('lx',0);T('ly',.15)}
 else if(state==='typing'){T('type',1);T('glow',.2);T('rot',0);T('lean',0);T('lx',0);T('ly',0);T('sy',1)}
}
let last=0,t0=performance.now();
function frame(now){requestAnimationFrame(frame);if(document.hidden||now-last<15)return;
 const dt=Math.min(.05,(now-(last||now))/1000);last=now;const t=(now-t0)/1000;sT+=dt;
 choreo(t);stepSprings(dt);
 const sl=Math.max(0,Math.min(1,G('sleep')));
 if(sl>.35)wasAsleep=true;
 if(wasAsleep&&sl<.25&&state!=='sleeping'){wasAsleep=false;blinkT=0;}  // waking: eyes open with a blink
 if(blinkT<0&&t>nextBlink&&state!=='typing'&&sl<.05){blinkT=0;nextBlink=t+2+R()*4+(R()<.2?-1.7:0);}
 let lid=1;if(blinkT>=0){blinkT+=dt;const p=blinkT/.16;lid=p<1?1-Math.sin(p*Math.PI)*.88:1;if(p>=1)blinkT=-1;}
 if(forceBlink!==null)lid=forceBlink;
 const Sc=H/720,ty=Math.max(0,Math.min(1,G('type')));
 const sb=Math.sin(t*6.283/4.6);  // slow sleep breath, ~4.6 s cycle
 const breath=1+.012*Math.sin(t*1.3)*(1-sl)+.025*sb*sl;
 const exhale=Math.max(0,-sb)*sl;
 const h0=H*LAY.h*breath,w0=h0*1.9,cx=W*LAY.cx,cy=H*LAY.cy+sl*H*LAY.h*.05;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const gl=G('glow'),gp=(.5+.12*Math.sin(t*1.2)+gl*(.35+.25*Math.sin(t*4)))*(1-.6*sl)*(1+.25*sb*sl);
 const gg=ctx.createRadialGradient(cx,cy,h0*.45,cx,cy,w0*.75);
 gg.addColorStop(0,`rgba(20,195,112,${.16*gp})`);gg.addColorStop(.5,`rgba(20,195,112,${.05*gp})`);gg.addColorStop(1,'rgba(20,195,112,0)');
 ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
 // typing morph: pill squashes to a circle, which then shrinks to the size of two side dots
 const tSince=state==='typing'?sT:0;
 const shrink=state==='typing'?Math.min(1,Math.max(0,(tSince-.15)/.45)):0,se=shrink*shrink*(3-2*shrink);
 const circR=h0/2*(1-.06*ty)*(1-se*.62);
 const w=(w0+(circR*2-w0)*ty)*(1+.015*exhale),h=(h0+(circR*2-h0)*ty)*G('sy')*(1-.03*exhale);  // gentle squash on exhale
 ctx.save();ctx.translate(cx,cy+(1-G('sy'))*h0*.5);ctx.rotate(G('rot'));ctx.scale(G('scl'),G('scl'));
 ctx.beginPath();const N=140,amp=h0*.008*(1-ty);
 for(let i=0;i<=N;i++){const[x,y,nx,ny]=stadium(i/N,h,w);const a=i/N*6.283;
  const d=amp*(n1(Math.cos(a)*1.5+t*.6+10)+n1(Math.sin(a)*1.5+t*.5+40)+.6*n1(Math.cos(a*3)*2+Math.sin(a*2)+t*.9+70));
  const px=y+ny*d,py=x+nx*d;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
 ctx.closePath();{const bg=ctx.createLinearGradient(0,-h/2,0,h/2);bg.addColorStop(0,'#14C370');bg.addColorStop(.55,'#14C370');bg.addColorStop(.7,'rgb(19,188,108)');bg.addColorStop(.85,'rgb(18,178,102)');bg.addColorStop(1,'rgb(17,170,97)');ctx.fillStyle=bg;}ctx.fill();
 // eyes, clipped to the body (footage shows them sliding under the top edge)
 const eA=Math.max(0,1-ty*2.2);
 if(eA>0){ctx.save();ctx.clip();ctx.globalAlpha=eA;ctx.fillStyle='#000';const lidS=lid*(1-sl);
  const rd=Math.max(0,Math.min(1,G('round'))),eS=1/Math.max(.6,G('scl'))*(state==='looking'?.75:1);
  const ew=h0*(.25+(.26-.25)*rd)*eS,eh=h0*(.46+(.26-.46)*rd)*eS*Math.max(lidS,.1),ehh=Math.max(eh,2*Sc);
  const ex=h0*(.25+.02*rd)*eS,ey=-h0*.02;
  for(const s of[-1,1]){const x=s*ex+G('lx')*h0*.272,y=ey+G('ly')*h0*.3;
   ctx.save();ctx.translate(x,y);ctx.rotate(G('lean'));
   if(sl<.55){ctx.globalAlpha=eA*(1-Math.max(0,sl-.35)/.2);ctx.beginPath();ctx.roundRect(-ew/2,-ehh/2,ew,ehh,Math.min(ew/2,ehh/2));ctx.fill();}
   if(sl>.35){// closed sleeping eye: short downward-curved arc
    ctx.globalAlpha=eA*Math.min(1,(sl-.35)/.2);ctx.beginPath();ctx.moveTo(-ew*.5,0);ctx.quadraticCurveTo(0,ew*.38,ew*.5,0);
    ctx.lineWidth=h0*.05;ctx.lineCap='round';ctx.strokeStyle='#000';ctx.stroke();}
   ctx.restore();}
  ctx.restore();}
 // side dots
 if(ty>.02){const rs=h0*.1*Math.min(1,ty*1.3),gap=Math.max(circR+rs+h0*.08,h0*.42)*Math.min(1,ty);
  const wave=state==='typing'?Math.max(0,tSince-.6):0;
  const dots=[[-gap,rs,0],[gap,rs,2]];
  for(const[x,r,ph]of dots){const pu=wave>0?.5+.5*Math.sin(wave*7-ph):0;
   ctx.beginPath();ctx.arc(x,0,r*(1+.12*pu),0,6.283);
   ctx.fillStyle=`rgba(20,195,112,${(.42+.4*pu)*ty})`;ctx.fill();}
  if(wave>0){/* middle dot also joins the wave */}}
 ctx.restore();
 // drifting z's from the upper right of the body, one per breath
 if(sl>.6&&state==='sleeping'){const ph=Math.floor(t/1.55);if(lastZ<0){zs.push({b:t-1.4},{b:t-2.9});}if(ph!==lastZ){lastZ=ph;zs.push({b:t});}}
 zs=zs.filter(z=>t-z.b<4.2);if(state!=='sleeping')lastZ=-1;
 for(const z of zs){const a=(t-z.b)/4.2,fs=h0*(.11+.1*a);
  ctx.save();ctx.globalAlpha=Math.sin(Math.PI*Math.min(1,a*1.15))*.85*Math.max(sl,.0);
  ctx.fillStyle='#6EE7B7';ctx.font=`700 ${fs}px "Nunito","Varela Round",system-ui,sans-serif`;
  ctx.translate(cx+w0*.38+a*h0*.35+Math.sin(a*6)*h0*.04,cy-h0*.4-a*h0*.6);ctx.rotate(-.15);ctx.fillText('z',0,0);ctx.restore();}
}
let zs=[],lastZ=-1,wasAsleep=false;
requestAnimationFrame(frame);
if(Q.get('state'))setAvatarState(Q.get('state'));
if(Q.has('sim')){const sec=+Q.get('sim');for(let i=0;i<sec*120;i++){sT+=1/120;choreo(i/120);stepSprings(1/120);}t0-=sec*1000;nextBlink+=sec;}
const inp=document.getElementById('in'),echo=document.getElementById('echo');let tms=[];
if(inp)inp.addEventListener('keydown',e=>{if(e.key!=='Enter'||!inp.value.trim())return;
 echo.textContent=inp.value.trim();echo.style.opacity=.45;inp.value='';tms.forEach(clearTimeout);
 const seq=[['thinking',0],['looking',1500],['working',4300],['typing',7300],['idle',9300]];
 tms=seq.map(([s,d])=>setTimeout(()=>{setAvatarState(s);if(s==='idle')echo.style.opacity=0},d));});
})();
</script>
<script>
(()=>{
const Q=new URLSearchParams(location.search);
setAvatarState('sleeping');
const tEl=document.getElementById('time'),dEl=document.getElementById('date');
function clk(){const d=new Date();tEl.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 dEl.textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});}
clk();setInterval(clk,10000);
const dots=document.getElementById('dots'),keys=document.getElementById('keys'),hint=document.getElementById('hint');
let pin='';const MAXD=8;
function draw(){const n=Math.max(4,pin.length);dots.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('span');if(i<pin.length)s.className='on';dots.appendChild(s);}}
function press(k){
 if(k==='del'){pin=pin.slice(0,-1);}
 else if(k==='ok'){
  if(pin.length<4){dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');return;}
  setAvatarState('idle');   // wake up (demo)
  if(pin==='1234'){hint.textContent='Unlocked (demo)';}
  else{hint.textContent='Wrong PIN';dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');
   setTimeout(()=>{setAvatarState('sleeping');hint.textContent='Enter PIN'},2200);}
  pin='';
 } else if(pin.length<MAXD)pin+=k;
 draw();}
['1','2','3','4','5','6','7','8','9','del','0','ok'].forEach(k=>{const b=document.createElement('button');
 b.textContent=k==='del'?'⌫':k==='ok'?'Unlock':k;if(k==='del')b.className='act';if(k==='ok')b.className='ok';
 b.setAttribute('aria-label',k==='del'?'Delete':k==='ok'?'Unlock':k);
 b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});keys.appendChild(b);});
addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter')press('ok');});
if(Q.has('demo'))pin='123'.slice(0,+Q.get('demo'));
draw();
})();
</script></body></html>
