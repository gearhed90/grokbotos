# Grok Bot OS: removable drives opened from Files / storage.mount (UDisks2).
# NTFS uses the in-kernel ntfs3 driver (fast, read-write), falling back to
# ntfs-3g (FUSE). exFAT uses the in-kernel exfat driver. Other types keep
# the UDisks2 defaults. See udisks2(8) mount_options.conf.
[defaults]
ntfs_drivers=ntfs3,ntfs
