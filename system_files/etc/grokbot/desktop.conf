# Grok Bot OS desktop defaults. Users override with grokbot-wallpaper,
# which writes ~/.config/grokbot/desktop.conf.
# The desktop never shows icons. A later widget layer goes here too
# (docs/DESKTOP.md).
[desktop]
wallpaper = /usr/share/grokbot/wallpapers/lofoten.jpg
# swaybg mode: fill | fit | stretch | center | tile
mode = fill
# Shown while the image loads, or if it is missing.
color = #000000
