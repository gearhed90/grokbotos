# Grok Bot OS dock defaults. Users override with grokbot-dock-config,
# which writes ~/.config/grokbot/dock.conf. There are no desktop icons.
#
# top, bottom:  off | icons          (always icon-only)
# left, right:  off | icons | labels (labels = icon + app name)
[dock]
top = off
bottom = icons
left = off
right = off
icon_size = 40
# Status area (clock, battery, Wi-Fi, volume) at the end of one dock:
# auto (bottom, else the first enabled edge) | off | top | bottom | left | right
status = auto
# Desktop file ids never shown in the dock (';'-separated).
hide = footclient.desktop;foot-server.desktop
