<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ghostscript (pulled in by cups-filters for printing) hard-requires
     google-droid-sans-fonts. Its fallback font then wins Pango's Hangul
     fallback and Korean text in GTK windows (consent prompt) renders as
     loose jamo. Noto Sans / Noto Sans CJK already cover every script we
     ship, so the Droid fonts are never used for UI text. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-droid-sans-fonts/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
