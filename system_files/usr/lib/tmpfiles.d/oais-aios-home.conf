# `useradd --create-home aios` in build_files/build.sh runs at image BUILD
# time, which writes under /var/home/aios -- the same /var/home symlink
# target other parts of this project already had to route around (see
# docs/DECISIONS.md's "/opt and /home are symlinked to /var" note), because
# /var content written during the build isn't guaranteed to survive into
# the shipped image. If /var/home/aios doesn't exist at boot, Path.home()
# calls anywhere in orchestrator/ (provider.json, registry.db, the shell
# log below) hit a PermissionError trying to mkdir under root-owned
# /var/home, which crashes the kiosk session before Firefox ever launches
# -- silently, since there's no terminal to show the traceback (this is
# the actual root cause of a 2026-07-11 "sway starts, cursor shows, but
# the screen stays black" report).
#
# This file ships under /usr, so systemd-tmpfiles-setup.service (which
# always runs at boot) recreates the directory with correct ownership
# every time, independent of whatever the build-time useradd did or didn't
# manage to persist.
d /var/home/aios 0700 aios aios -
