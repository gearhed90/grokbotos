# useradd --create-home grokbot runs at image build time and writes
# /var/home/grokbot. On this ostree/bootc base, /var content from the
# build is not guaranteed to ship. systemd-tmpfiles-setup.service runs
# on every boot and recreates the directory from this /usr file.
# Type "d" creates the directory if it is missing and does not wipe
# files that are already there, so a logged-in Grok Bot session survives
# reboot. See docs/DECISIONS.md (2026-07-11 black screen, 2026-10-18 pivot).
d /var/home/grokbot 0700 grokbot grokbot -
d /var/home/grokbot/Apps 0700 grokbot grokbot -
d /var/home/grokbot/.local 0700 grokbot grokbot -
d /var/home/grokbot/.local/share 0700 grokbot grokbot -
d /var/home/grokbot/.local/share/grokbot 0700 grokbot grokbot -
d /var/home/grokbot/.local/share/applications 0700 grokbot grokbot -
