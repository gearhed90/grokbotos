<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>
<header>
  <img src="icon.svg" alt="" width="30" height="30">
  <h1 data-t="title">Notes</h1>
  <span class="grow"></span>
  <span class="dim" id="where"></span>
  <button type="button" id="lang">한국어</button>
</header>
<div id="wrap">
  <aside>
    <div class="row"><input type="search" id="q" data-ph="search" placeholder="Search"><button type="button" class="primary" id="new" data-t="new">New note</button></div>
    <ul id="list"></ul>
  </aside>
  <section id="ed">
    <input type="text" id="title" data-ph="untitled" placeholder="Untitled" maxlength="200">
    <textarea id="body" data-ph="write" placeholder="Write here…" spellcheck="false"></textarea>
    <div class="row"><span class="dim" id="saved"></span><span class="grow"></span><button type="button" class="danger" id="del" data-t="delete">Delete</button></div>
  </section>
  <section id="empty" class="hidden"><p class="dim" data-t="empty">No notes yet. Press "New note" to start.</p></section>
</div>
<script src="app.js"></script>
</body>
</html>
