<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
</head>
<body>
<header>
  <img src="icon.svg" alt="" width="30" height="30">
  <h1 data-t="title">Media Player</h1>
  <span class="grow"></span>
  <span class="pill" id="keys"></span>
  <button type="button" id="lang">한국어</button>
</header>
<div id="wrap">
  <main>
    <div id="stage"><video id="v" playsinline></video><div id="art"><div id="disc">♪</div><div id="nowt"></div></div></div>
    <div id="seek"><span id="cur" class="dim">0:00</span><input type="range" id="pos" min="0" max="1000" value="0"><span id="dur" class="dim">0:00</span></div>
    <div id="ctl">
      <button type="button" id="prev" title="Previous"><img src="i-prev.svg" alt="" width="22" height="22"></button>
      <button type="button" id="play" class="primary big" title="Play"><img id="playi" src="i-play.svg" alt="" width="26" height="26"></button>
      <button type="button" id="next" title="Next"><img src="i-next.svg" alt="" width="22" height="22"></button>
      <span class="grow"></span>
      <span class="dim">🔊</span><input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </main>
  <aside>
    <div class="row"><label class="filebtn primary"><span data-t="add">Add files</span><input type="file" id="pick" accept="audio/*,video/*" multiple></label>
      <button type="button" id="clear" data-t="clear">Clear list</button></div>
    <ol id="list"></ol>
    <p class="dim" id="hint" data-t="hint">Pick music or video files, or drop them here. Files never leave this computer.</p>
    <div id="need" class="need hidden"><span data-t="needkeys">To use the keyboard Play / Next keys, this app needs the "Media keys" permission.</span><button type="button" id="askkeys" data-t="ask">Ask for permission</button><span class="dim" id="askmsg"></span></div>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
